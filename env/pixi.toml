[workspace]
authors = ["Manthan Gadhia <54841046+manthangadhia@users.noreply.github.com>"]
channels = ["conda-forge", "ejolly"]
name = "env"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
download-spacy-trf = "python -m spacy download en_core_web_trf"

[dependencies]
python = "3.11.*"
ipykernel = ">=7.1.0,<8"
matplotlib = ">=3.10.8,<4"
pandas = ">=2.3.3,<3"
pyarrow = ">=21.0.0,<22"
scikit-learn = ">=1.7.2,<2"
tqdm = ">=4.67.1,<5"
nomkl = ">=1.0,<2"
pip = ">=26.0.1,<27"
nltk = ">=3.9, <4"
statsmodels = ">=0.14.6,<0.15"
python-dotenv = ">=1.2.2,<2"
openpyxl = ">=3.1.5,<4"
ijson = ">=3.5.0,<4"
setuptools = "69.5.1.*"
numpy = ">=2.4.3,<3"
pyahocorasick = ">=2.3.0,<3"

[pypi-dependencies]
transformers = "==4.35.2"
datasets = ">=4.4.1, <5"
accelerate = ">=1.12.0, <2"
sentencepiece = ">=0.2.1, <0.3"
einops = ">=0.8.1, <0.9"
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu126" }
bitsandbytes-windows = ">=0.37.5, <0.38"
evaluate = ">=0.4.6, <0.5"
pandarallel = ">=1.6.5, <2"
protobuf = ">=6.33.5, <7"
huggingface-hub = ">=0.36.2, <0.37"
urllib3 = ">=2.6.3, <3"
sentence-transformers = ">=3.0.1, <4"
spacy = ">=3.8.14, <4"
fastcoref = ">=2.1.6, <3"
faiss-cpu = ">=1.13.2, <2"
fastparquet = ">=2026.3.0, <2027"
